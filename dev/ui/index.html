<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exiles — UI sandbox</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #17130e; color: #eadfc8; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; outline: none; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="scene"></canvas></div>
    <div id="ui"></div>
    <script type="module" src="./sandbox.ts"></script>
  </body>
</html>
