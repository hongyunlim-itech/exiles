<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>render-entities sandbox</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1712; font: 12px/1.4 system-ui, sans-serif; color: #eadfc8; }
      #app { position: fixed; inset: 0; }
      #panel {
        position: fixed; top: 8px; left: 8px; padding: 8px 10px; background: rgba(28, 22, 16, 0.82); border-radius: 6px;
        display: grid; grid-template-columns: auto auto; gap: 4px 8px; align-items: center; z-index: 2;
      }
      #panel select, #panel input { font: inherit; }
      #stats { position: fixed; bottom: 8px; left: 8px; padding: 6px 8px; background: rgba(28, 22, 16, 0.8); border-radius: 6px; white-space: pre; z-index: 2; }
      body.shot #panel, body.shot #stats { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="panel">
      <label for="month">Month</label>
      <select id="month"></select>
      <label for="weather">Weather</label>
      <select id="weather"><option>none</option><option>rain</option><option>snow</option></select>
      <label for="snow">Snow cover</label>
      <input id="snow" type="range" min="0" max="1" step="0.05" />
      <label for="cam">Camera</label>
      <select id="cam"></select>
      <label for="quality">Quality</label>
      <select id="quality"><option>high</option><option>medium</option><option>low</option></select>
      <label for="tornado">Tornado</label>
      <input id="tornado" type="checkbox" />
    </div>
    <div id="stats"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
