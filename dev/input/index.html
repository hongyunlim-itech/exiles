<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Exiles — input sandbox</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #17130e; color: #eadfc8; font: 12px/1.4 sans-serif; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }
      #hud { position: fixed; left: 8px; top: 8px; background: rgba(0,0,0,.55); padding: 6px 8px; pointer-events: none; white-space: pre; }
      #toasts { position: fixed; right: 8px; top: 8px; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="toasts"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
